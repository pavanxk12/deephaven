[project]
name = "algo"
version = "0.1.0"
description = "Deephaven trading stack: master, candles, straddle, the NATS service, the book (portfolio numbers), end of day, console."
requires-python = ">=3.10"
dependencies = ["pandas", "numpy"]

[project.optional-dependencies]
runtime = ["nats-py"]      # installed in the Deephaven image; needed only by the bridge
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["algo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
