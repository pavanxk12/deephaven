# Parameters for every strategy in this folder, one section per strategy.
# The .py files read this file and nothing else: change a value here, not in the script.
#
# Values are Python literals -- 1, 1.25, True, None, "text", [1, 2], (1, 2), {"a": 1} --
# except times, which are HH:MM. A '#' is NOT an inline comment: comments go on their own line.
# A multi-line value (a big dict) continues on indented lines.

[meanrevert]
# 08_us_basket_rsi_crossorder.py

USER = 3

# its name: recorded with every portfolio, the name of its sending switch and of its console window
STRATEGY = "meanrevert"

# named sector baskets: a symbol is ranked only against the OTHERS of ITS basket (each saved as its own basket.txt entry)
BASKETS = {
  "us":   ["MSFT", "GOOG", "META", "AMZN", "NFLX", "SHOP", "CRWD", "PANW", "PLTR", "AAPL", "TSLA","WMT", "COST", "PEP", "AMGN", "LIN", "GILD", "SPCX","NVDA", "AVGO", "AMD", "MU", "ASML", "INTC", "AMAT", "MRVL", "KLAC", "ADI", "QCOM", "ARM", "SNDK", "TXN", "CSCO"],
  }

# optional: {"AAPL": "<another contract name or token>"} trade another contract than the basket entry
TRADE_AS = {}

# relative() level: today's open and VWAP
LEVEL = "intraday"

# pct_vwap's percentile among the basket must be ABOVE its high for a SELL (OVERBOUGHT), or BELOW its low for a BUY (OVERSOLD)
# relative(): pct_open's percentile among the basket must land inside its (low, high) band (Q2 to Q3);
REL_ZONE = {"pct_open": (25.0, 75.0), "pct_vwap": (25.0, 75.0)}

# absolute(): compare the stock with itself at the same minute of its previous 22 trading days (saved files); 0 = off
ABS_DAYS = 22

# pct_vwap's percentile against its own days must be ABOVE its high for a SELL (OVERBOUGHT), or BELOW its low for a BUY (OVERSOLD)
# absolute(): pct_open's percentile against its own days must land inside its (low, high) band (Q2 to Q3);
ABS_ZONE = {"pct_open": (25.0, 75.0), "pct_vwap": (25.0, 75.0)}

# the bar the RSI is computed on (made from the 1-minute candles)
RSI_BAR = "5min"

RSI_N = 9

RSI_HIGH = 70

RSI_LOW = 30

# True: the bar still forming counts too (acts every minute); False: finished bars only
RSI_LIVE = False

# 1-minute close. False: look for an entry on every 1-minute candle
# True: look for an ENTRY only on the 1-minute candle that ends an RSI_BAR bar (:05, :10, :15 ... for 5min). Take-profit and stop-loss are still checked on every
ACT_ON_BAR_END = True

# how many earlier saved days seed the RSI (0 = none)
HIST_DAYS = 1

TARGET_PCT = 3.0

STOP_PCT = 0.5

# None: plain TARGET_PCT / STOP_PCT. A number: once the move in its favour reaches this, the stop shifts from -STOP_PCT to PROFIT_LOCK_PCT
TRAIL_TRIGGER_PCT = 1.25

# the new stop level once TRAIL_TRIGGER_PCT is reached (e.g. 0.3 locks in at least +0.3%); must be set together with TRAIL_TRIGGER_PCT
PROFIT_LOCK_PCT = 1.0

# move - TRAIL_STEP_PCT (never lowered), so once the move is up X% the lock is up (X - TRAIL_STEP_PCT)% -- it never gives back more than TRAIL_STEP_PCT
# None: the lock stays at PROFIT_LOCK_PCT once trailing starts. A number: from then on the lock continuously follows the move, held at
TRAIL_STEP_PCT = 0.2

# (the pasted script forgets this on a paste or a restart)
# True: each stock gets ONE entry; once it has been entered, a take-profit, stop-loss or any exit ends its trading (no new entry in it). False: it may be entered again
ONE_ENTRY_PER_STOCK = True

# in LOTS (the plugin multiplies it by the contract's lot size)
QTY = 1

# if one share costs more than ENTRY_VALUE the quantity would be 0 and that entry is skipped (it says so)
# None: every entry is QTY lots. A number (dollars): the quantity at entry is int(ENTRY_VALUE / the last 1-minute close), QTY is then not used;
ENTRY_VALUE = 5000

# "CrossOrder" is the engine's name for the CrossOrder plugin
ENGINE = {"strategyname": "LimitOrder", "SERVERCODE": 15046, "ACCOUNT": "PRO", "ALGOID": "1","MAX_TRIES":5}

# entries only inside it (New York time, the regular session is 09:30 to 16:00); an exit is sent at any time
WINDOW_START = 10:00
WINDOW_END   = 15:00

# time exit (New York time): 5 minutes before the 16:00 close, the automation is stopped like algo_stop (pause, square up, unsubscribe every portfolio) and no entry is made after it
EXIT_AT = 15:45

# 32 plugin instances in all (all scripts together), so two scripts at the same time need smaller numbers. No entry while the script is at the limit.
# portfolios this script may hold in the engine at once: open positions plus closed ones waiting for their unsubscribe. The engine seems to keep about
MAX_PORTFOLIOS = 28

# the wait lets the plugin send and fill its closing order first. None = never (the slot is then held until the stop at the end of the day)
# a closed position's portfolio is unsubscribed this many seconds after its exit (take-profit, stop-loss, z-exit) so the engine frees the slot;
UNSUB_AFTER_S = 60

# how many times release_exit() waits UNSUB_AFTER_S for the exit's fills before it gives up: it then cancels what is left of the
# exit order and the position goes back to open, to be exited again. The exit portfolio is never unsubscribed while its order may
# still fill, because the unsubscribe would destroy that order and leave the entry's shares open with nothing watching them.
EXIT_SETTLE_TRIES = 3

# The candle check stays as the backup, and is used alone if the tick listener cannot be set up (it says so). Needs TARGET_PCT or STOP_PCT.
# True: target and stop-loss are also checked on every price tick of the live feed (FEED_TABLE) for the open positions only, not just on each 1-minute close.
TICK_EXITS = True

# the live feed: columns token, ltp, b0p (best bid), a0p (best ask) (raw price; the contract's own divisor from the master turns it into the price)
FEED_TABLE = "fo_market_data"

# most this (in price units, after the divisor) before the LimitOrder is actually sent, instead of firing it the instant the signal passes.
# entry and exit both wait for the live spread (best ask - ltp for a BUY-side order, ltp - best bid for a SELL-side order) to be at
SPREAD_MAX = 0.30

# at the best price seen once this runs out: a stop-loss/target must not just hang unsent.
# how long an entry may wait for SPREAD_MAX before it is given up on (no trade this signal). An EXIT instead falls back to firing anyway
SPREAD_WAIT_S = 60

# the spread is still SPREAD_MAX-ok AND the price has moved since the last one sent. After CHASE_TRIES it is cancelled (paused) and,
# for an entry, unsubscribed -- nothing more is tried for that signal.
# once a LimitOrder is resting, up to this many times it is re-priced ("apply", not a new subscribe) to the current best price, each time
CHASE_TRIES = 3

# how often (seconds) a resting order's chase re-checks the best price
CHASE_EVERY_S = 3

FAIL_COOLDOWN_S = 30

# for this many seconds instead of giving up on that stock for the whole bar. 0 = no retry
# a ranking read that fails (a rare clash with the update cycle: "Previous values requested or inconsistent") is tried again on the next candle batches
RETRY_RANKING_S = 20


