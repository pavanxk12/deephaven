# config/strategies/nifty_sma.ini: the SETTINGS block of examples/05_nifty_sma_cross.py
# Started with:  algoctl start libNiftySmaCross.so --class NiftySmaCross --config nifty_sma.ini

[strategy]                 # read by the strategy (bare keys: s.get("underlying"))
underlying      = NIFTY
expiry_index    = 0        # 0 = the nearest expiry that has not passed
n_strikes       = 5        # how many strikes nearest the money
fail_cooldown_s = 30       # after a failed order, wait this long before that strike is tried again
trade_from      = 09:20    # trade only inside this window (exchange time)
trade_to        = 15:20

[signal]
fast = 5                   # SMA lengths, in candles of the future
slow = 20

[sizing]                   # order_params(): fractions of the option premium
ival_pct  = 0.01
range_pct = 0.05
trp_pct   = 0.01
jval_frac = 0.75
sval_mult = 3

[apply]                    # passed through to every apply as they are
target      = 1000
stoploss    = -400
maxloss     = -400
jqty1       = 1
jqty2       = 1
max_unhedge = 1
PRNT        = 1

[host]                     # read by algod, not by the strategy (algo_start's arguments)
user      = 3
pf_start  = 1001
add_qty   = 3
autostart = false          # true: switch sending ON once onStart returns

[subscribe]                # fields added to every subscribe (algo_start(..., subscribe={...}))
strategyname = Churning
