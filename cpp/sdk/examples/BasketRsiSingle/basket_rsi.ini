# config/strategies/basket_rsi.ini: the SETTINGS of examples/07_basket_rsi_crossorder.py

[strategy]
basket         = banks     # a [section] of baskets.txt
max_portfolios = 28        # the engine has a limited number of plugin slots: no new entry while this many are held

[rsi]
n    = 9
high = 70
low  = 30

[filter]                   # % from open AND % from VWAP must be in the middle of the basket (relative percentile)
mid_lo = 25
mid_hi = 75

[exit]
target_pct    = 1.5
stop_pct      = 0.5
unsub_after_s = 60         # unsubscribe a closed portfolio this long after its squareup (frees the engine slot)

[order]
qty_lots = 1

[engine]                   # the fields of the one subscribe that starts each trade (CrossOrder = "single")
strategyname = single
SERVERCODE   = 15046
ACCOUNT      = PRO
ALGOID       = 1

[host]
user      = 3
pf_start  = 1001
autostart = false
