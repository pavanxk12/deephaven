# US (cash equities, ETFs, options). Values from algo/core/config.py (Market US).
# The feed's ltt is UTC text ("2026-10-15 11:01:04"); sessions and "today" are New York time.

[market]
code       = US
currency   = $
tz         = America/New_York
weekend    = Sat,Sun
holidays   = US.holidays

[feed]
ltt_tz      = UTC
ltt_format  = %Y-%m-%d %H:%M:%S
dh_table    = fo_market_data
kafka_topic = hft.marketdata.fo
price_div   = 10000
bar_grace_s = 10

[session]
regular      = 09:30-16:00       # 390 one-minute slots
trade_window = 09:35-15:45

[schedule]
master_at         = 09:15:00
candles_at        = 09:29:30
close_at          = 16:00:00
straddle_at_close =
retry_s           = 60
retries           = 10

[contracts]
source        = file
file_pattern  = <yyyymmdd>DB.db3
pg_table      = resultset_<yyyymmdd>
expiry_epoch  = 1970-01-01
strike_div    = 10000
tick_div      = 10000
columns       = Token,Symbol,ExpiryDate,InstType,OptionType,StrikePrice,LotSize,TickSize,Divisor,Exch

[expense]                        # none: no expense tiles

[display]
turnover_unit = 1
