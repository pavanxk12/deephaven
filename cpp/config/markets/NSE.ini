# NSE (India F&O + cash). Every value here was hardcoded in algo/core/config.py (Market NSE); nothing is compiled into algod.

[market]
code       = NSE
currency   = ₹
tz         = Asia/Kolkata        # exchange time zone: sessions, "today", the contract file's date
weekend    = Sat,Sun
holidays   = NSE.holidays        # one yyyy-mm-dd per line, next to this file

[feed]
ltt_tz      = Asia/Kolkata       # the zone the feed's ltt text is written in
ltt_format  = %d-%m-%Y %H:%M:%S
dh_table    = fo_market_data
kafka_topic = hft.marketdata.fo
price_div   = 100                # raw feed price -> currency, only for a contract with no Divisor
bar_grace_s = 10                 # a bar is closed this many seconds after it ends (feed clock)

[session]
regular      = 09:15-15:30       # data / series window: 375 one-minute slots
trade_window = 09:20-15:00       # strategies ignore signals outside this

[schedule]                       # day_auto(): exchange time
master_at         = 09:00:00
candles_at        = 09:14:30
close_at          = 15:30:00
straddle_at_close = 0            # straddle_start(0) at the close, before the save; empty = not started
retry_s           = 60
retries           = 10

[contracts]
source        = auto             # file | postgres | auto (Postgres first, the .db3 when it cannot give the day)
file_pattern  = <yyyymmdd>DB.db3
pg_table      = resultset_<yyyymmdd>
expiry_epoch  = 1980-01-01
strike_div    = 100
tick_div      = 100
columns       = Token,Symbol,ExpiryDate,InstType,OptionType,StrikePrice,LotSize,TickSize,Divisor,Exch

[expense]                        # rupees per crore (1e7) of the value bought, sold
FUT = 600,5400
OPT = 5625,20328
EQ  = 200,200

[display]
turnover_unit = 100000           # the turnover limit is typed and shown in lakhs
