# The process: which market to run, where the container's data volume is mounted, and how to reach Postgres.
# Everything that differs BETWEEN markets lives in markets/<CODE>.ini instead (this file does not change for US vs NSE).

[process]
market       = NSE                   # loads markets/NSE.ini

[paths]
market_data  = /data/fo_market_data  # contract .db3 files, history parquet (read-only mount)
cache        = /data/algo/cache      # rebuildable caches (master, etc.); empty = no caching

[postgres]                           # the Docker service names, same as algo/core/pg.py's PG_DEFAULTS
host         = postgres
port         = 5432
database     = algofusion
user         = algofusion
password_env = ALGO_PG_PASSWORD      # the password is never written here: it is read from this env var at connect time
